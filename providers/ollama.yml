# ─────────────────────────────────────────────────────────────────────────────
# AuraCV - Ollama (Local) Provider Contract
# Ollama exposes an OpenAI-compatible API. No API key required.
# Run `ollama serve` and `ollama pull llama3.2` before using.
# ─────────────────────────────────────────────────────────────────────────────

provider: ollama
name: Ollama (Local)
icon: ollama
description: Run AI locally — Free, private, offline. Requires Ollama installed.
local: true                         # Signals that no API key is needed

# ─── API Connection ───────────────────────────────────────────────────────────
api:
  base_url: http://localhost:11434
  content_type: application/json
  accept: application/json
  auth:
    type: none                      # No authentication for local Ollama

# ─── Models ──────────────────────────────────────────────────────────────────
models:
  default: llama3.2
  options:
    - id: llama3.2
      name: "Llama 3.2 (3B)"
      context_window: 128000
      recommended: true
    - id: llama3.1
      name: "Llama 3.1 (8B)"
      context_window: 128000
    - id: mistral
      name: "Mistral 7B"
      context_window: 32768
    - id: qwen2.5
      name: "Qwen 2.5 (7B)"
      context_window: 128000
    - id: phi3
      name: "Phi-3 Mini (fastest)"
      context_window: 128000

# ─── Endpoints ───────────────────────────────────────────────────────────────
endpoints:
  # Ollama chat API — OpenAI-compatible /api/chat endpoint
  chat:
    path: /api/chat
    method: POST
    content_type: application/json
    request:
      model: "{{model}}"
      messages:
        - role: user
          content: "{{prompt}}"
      stream: false                 # Disable streaming — we need full response
      format: json                  # Force JSON output from Ollama
    response:
      extract: "message.content"
      parse: json
      strip_markdown_fences: true

  test:
    # Use the tags endpoint (no model needed) to check if Ollama is running
    path: /api/tags
    method: GET
    response:
      extract: "models"             # List of installed model names
      parse: json

  # List locally installed models
  list_models:
    path: /api/tags
    method: GET
    response:
      extract: "models"
      parse: json

  # Pull a model (triggers download)
  pull_model:
    path: /api/pull
    method: POST
    content_type: application/json
    request:
      name: "{{model}}"
      stream: false
    response:
      extract: "status"
      parse: text

# ─── Features ────────────────────────────────────────────────────────────────
# Note: Quality depends heavily on the local model chosen.
# Larger models (llama3.1 8B+) produce much better resume feedback.
features:
  redline:
    enabled: true
    endpoint: chat
    description: "Annotate a resume section with improvement suggestions"
    note: "Best with llama3.1 or qwen2.5"
    input:
      section_title: { type: string, required: true }
      section_content: { type: string, required: true }
      context: { type: string, required: false }
    output:
      overall_score: { type: number, range: [0, 100] }
      suggestions: { type: array }
      strengths: { type: array }
      summary: { type: string }

  rewrite:
    enabled: true
    endpoint: chat
    description: "Rewrite a resume bullet point"
    input:
      bullet: { type: string, required: true }
      tone: { type: string, required: false, default: professional }
      role: { type: string, required: false }
    output:
      rewritten: { type: string }
      alternatives: { type: array }
      action_verb_used: { type: string }
      improvement_notes: { type: string }

  ats_score:
    enabled: true
    endpoint: chat
    description: "Score resume against job description"
    input:
      resume_text: { type: string, required: true }
      job_description: { type: string, required: true }
    output:
      overall_score: { type: number, range: [0, 100] }
      keyword_match_score: { type: number }
      format_score: { type: number }
      experience_match_score: { type: number }
      matched_keywords: { type: array }
      missing_keywords: { type: array }
      section_scores: { type: object }
      recommendations: { type: array }
      summary: { type: string }

  keyword_gap:
    enabled: true
    endpoint: chat
    description: "Find keyword gaps"
    input:
      resume_text: { type: string, required: true }
      job_description: { type: string, required: true }
    output:
      critical_missing: { type: array }
      nice_to_have_missing: { type: array }
      already_present: { type: array }
      skills_gap: { type: object }
      summary: { type: string }

  import_parse:
    enabled: true
    endpoint: chat
    description: "Parse raw resume text into structured sections"
    input:
      raw_text: { type: string, required: true }
    output:
      name: { type: string }
      sections: { type: array }
