# ─────────────────────────────────────────────────────────────────────────────
# AuraCV - OpenRouter Provider Contract
# OpenRouter is OpenAI-compatible and gives access to 200+ models.
# Get your key at: https://openrouter.ai/keys
# ─────────────────────────────────────────────────────────────────────────────

provider: openrouter
name: OpenRouter
icon: openrouter
description: Access 200+ models (GPT-4o, Claude, Gemini, Llama) with one key

# ─── API Connection ───────────────────────────────────────────────────────────
api:
  base_url: https://openrouter.ai/api/v1
  content_type: application/json
  accept: application/json
  auth:
    type: bearer
    header: Authorization
    prefix: "Bearer "
  # OpenRouter requires these headers for routing and analytics
  extra_headers:
    HTTP-Referer: "http://localhost:5173"
    X-Title: "AuraCV"

# ─── Models ──────────────────────────────────────────────────────────────────
models:
  default: anthropic/claude-3.5-sonnet
  options:
    - id: anthropic/claude-3.5-sonnet
      name: "Claude 3.5 Sonnet (via OR)"
      context_window: 200000
      recommended: true
    - id: openai/gpt-4o
      name: "GPT-4o (via OR)"
      context_window: 128000
    - id: google/gemini-flash-1.5
      name: "Gemini 1.5 Flash (via OR)"
      context_window: 1000000
    - id: meta-llama/llama-3.1-70b-instruct
      name: "Llama 3.1 70B (free tier)"
      context_window: 131072
    - id: mistralai/mistral-7b-instruct
      name: "Mistral 7B (cheapest)"
      context_window: 32768
    - id: deepseek/deepseek-chat
      name: "DeepSeek Chat"
      context_window: 64000

# ─── Endpoints ───────────────────────────────────────────────────────────────
endpoints:
  # Fully OpenAI-compatible chat endpoint
  chat:
    path: /chat/completions
    method: POST
    content_type: application/json
    request:
      model: "{{model}}"
      messages:
        - role: user
          content: "{{prompt}}"
      temperature: 0.7
    # OpenRouter returns OpenAI-format responses
    response:
      extract: "choices[0].message.content"
      parse: json
      strip_markdown_fences: true   # Models on OR often wrap JSON in fences

  test:
    path: /chat/completions
    method: POST
    content_type: application/json
    request:
      model: "{{model}}"
      messages:
        - role: user
          content: 'Respond with only this JSON and nothing else: {"ok":true}'
      max_tokens: 15
    response:
      extract: "choices[0].message.content"
      parse: json
      strip_markdown_fences: true

  # OpenRouter model catalog
  list_models:
    path: /models
    method: GET
    response:
      extract: "data"
      parse: json

# ─── Features ────────────────────────────────────────────────────────────────
features:
  redline:
    enabled: true
    endpoint: chat
    description: "Annotate a resume section with improvement suggestions"
    input:
      section_title: { type: string, required: true }
      section_content: { type: string, required: true }
      context: { type: string, required: false }
    output:
      overall_score: { type: number, range: [0, 100] }
      suggestions: { type: array }
      strengths: { type: array }
      summary: { type: string }

  rewrite:
    enabled: true
    endpoint: chat
    description: "Rewrite a resume bullet point"
    input:
      bullet: { type: string, required: true }
      tone: { type: string, required: false, default: professional }
      role: { type: string, required: false }
    output:
      rewritten: { type: string }
      alternatives: { type: array }
      action_verb_used: { type: string }
      improvement_notes: { type: string }

  ats_score:
    enabled: true
    endpoint: chat
    description: "Score resume against a job description"
    input:
      resume_text: { type: string, required: true }
      job_description: { type: string, required: true }
    output:
      overall_score: { type: number, range: [0, 100] }
      keyword_match_score: { type: number }
      format_score: { type: number }
      experience_match_score: { type: number }
      matched_keywords: { type: array }
      missing_keywords: { type: array }
      section_scores: { type: object }
      recommendations: { type: array }
      summary: { type: string }

  keyword_gap:
    enabled: true
    endpoint: chat
    description: "Find keyword gaps"
    input:
      resume_text: { type: string, required: true }
      job_description: { type: string, required: true }
    output:
      critical_missing: { type: array }
      nice_to_have_missing: { type: array }
      already_present: { type: array }
      skills_gap: { type: object }
      summary: { type: string }

  import_parse:
    enabled: true
    endpoint: chat
    description: "Parse raw resume text into structured sections"
    input:
      raw_text: { type: string, required: true }
    output:
      name: { type: string }
      sections: { type: array }
