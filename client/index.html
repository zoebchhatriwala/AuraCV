<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>AuraCV - Modern Resume Builder</title>
    <meta name="title" content="AuraCV - Modern Resume Builder" />
    <meta
      name="description"
      content="Create a clean and professional resume in minutes. Pick a template, preview your design, and download your CV as PDF or Word."
    />
    <meta
      name="keywords"
      content="resume builder, cv maker, professional resume, modern templates, job application"
    />
    <meta name="author" content="AuraCV" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AuraCV - Modern Resume Builder" />
    <meta
      property="og:description"
      content="Create a clean and professional resume in minutes. Pick a template, preview your design, and download your CV as PDF or Word."
    />
    <meta property="og:site_name" content="AuraCV" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AuraCV - Modern Resume Builder" />
    <meta
      name="twitter:description"
      content="Create a clean and professional resume in minutes. Pick a template, preview your design, and download your CV as PDF or Word."
    />

    <!-- Theme and Color Scheme -->
    <meta name="theme-color" content="#08090f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

    <!-- Preconnect Google Fonts for Simplified, High-Speed Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
