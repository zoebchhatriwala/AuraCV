name: Build & Release Desktop App

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci || npm install
          npm --prefix server ci || npm --prefix server install
          npm --prefix client ci || npm --prefix client install

      - name: Build Web Client & Backend
        run: |
          npm run build:client
          npm run build:server
          npm run build:electron

      - name: Package Desktop Installer (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run build:desktop:win
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Desktop Installer (macOS)
        if: matrix.os == 'macos-latest'
        run: npm run build:desktop:mac
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Package Desktop Installer (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npm run build:desktop:linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/*.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
